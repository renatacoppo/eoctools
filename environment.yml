# Create the eocene environment:
# mamba env create -f environment.yml 
# or 
# conda env create -f environment.yml

name : eoctools
channels:
  - conda-forge
dependencies:
  - python>=3.9,<3.15
  - xarray
  - netcdf4
  - dask
  - numpy
  - pandas
  - cmocean
  - cdo
  - pip

  # Configuration
  - pyyaml
  # Visualization
  - matplotlib
  # Python packages
  - pip:
    - -e .